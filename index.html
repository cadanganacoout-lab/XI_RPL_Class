      (function () {
        try {
          var theme = localStorage.getItem("xirpl1-theme") ||
            (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");

        } catch {
          document.documentElement.setAttribute("data-theme", "light");
        }
      })();
