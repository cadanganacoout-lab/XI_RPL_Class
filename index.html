<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      (function () {
        try {
          var savedTheme = localStorage.getItem("xirpl1-theme");
          var theme = savedTheme === "light" || savedTheme === "dark" ? savedTheme : "dark";
          document.documentElement.setAttribute("data-theme", theme);
        } catch {
          document.documentElement.setAttribute("data-theme", "dark");
        }
      })();
    </script>

    <meta name="description" content="Beranda kelas XI RPL: jadwal pelajaran, piket harian, dan info kelas." />

      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;650;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/style.css" />
  </head>

    <script src="js/data.js"></script>

  </body>
